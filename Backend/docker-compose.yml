services:
  api:
    build: .
    # --reload + the bind mount below make code edits take effect without a
    # rebuild - uvicorn watches the mounted source and restarts itself.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
      - path: ${TSAGE_ENV_FILE:-.env.local}
        required: true
    # network_mode: host means the container's 127.0.0.1 is the real host
    # loopback, exactly where the Wazuh SSH tunnel forwards land - so
    # WAZUH_INDEXER_HOST/WAZUH_BASE_URL come from .env/.env.local as-is.
    # Do not override them to host.docker.internal here: that only resolves
    # correctly on Docker Desktop, whose "host" network is a VM, not this one.
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  alert-ingestion:
    build: .
    command: ["python", "-m", "app.workers.alert_ingestion"]
    # Bind mount so `docker compose restart alert-ingestion` picks up code
    # changes without a rebuild (no --reload here: it's a plain script loop,
    # not a uvicorn server, so it needs an explicit restart after edits).
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
      - path: ${TSAGE_ENV_FILE:-.env.local}
        required: true
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  orchestration:
    build: .
    command: ["python", "-m", "app.workers.orchestration"]
    # Same bind mount as alert-ingestion: restart to pick up edits, no rebuild.
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
      - path: ${TSAGE_ENV_FILE:-.env.local}
        required: true
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduled-triage:
    build: .
    command: ["python", "-m", "app.workers.scheduled_triage"]
    # Same bind mount as alert-ingestion/orchestration: restart to pick up
    # edits, no rebuild. No-op unless SCHEDULED_TRIAGE_ENABLED=true.
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
      - path: ${TSAGE_ENV_FILE:-.env.local}
        required: true
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${TSAGE_POSTGRES_DB:-tsage}
      POSTGRES_USER: ${TSAGE_POSTGRES_USER:-tsage}
      POSTGRES_PASSWORD: ${TSAGE_POSTGRES_PASSWORD:-tsage-local-dev-only}
    ports:
      - "${TSAGE_POSTGRES_PORT:-5434}:5432"
    volumes:
      - tsage-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      TSAGE_REDIS_PASSWORD: ${TSAGE_REDIS_PASSWORD:-tsage-redis-local-dev-only}
    command:
      - sh
      - -c
      - >-
        exec redis-server --save '' --appendonly no
        --requirepass "$${TSAGE_REDIS_PASSWORD}"
    ports:
      - "${TSAGE_REDIS_PORT:-6380}:6379"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli --no-auth-warning -a "$${TSAGE_REDIS_PASSWORD}" ping
          | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  tsage-postgres-data:
